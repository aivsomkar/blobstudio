name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The engine is generated from the GrokBot lab and committed, so the app builds
      # without it. The freshness check does need it: it regenerates into memory and
      # compares, which is the only thing that notices when the lab moves on and the
      # committed engine does not.
      #
      # The generator looks for the lab one level above the repo, which is where it lives
      # in local checkouts too — the gist is someone else's repository and is not vendored
      # here.
      - name: Fetch the GrokBot lab
        run: |
          if [ ! -f ../gist/index.html ]; then
            git clone --depth 1 https://gist.github.com/49a4c9303de70118a90dc43badc1aba5.git ../gist
          fi

      - run: npm ci

      - name: Engine is current
        run: npm run gen:engine:check

      - run: npm run lint

      - run: npm test

      - run: npm run build
