name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No engine-freshness check here, deliberately.
      #
      # The engine is generated from the GrokBot lab, and the working copy of that lab
      # carries local edits that are not in the published gist. Cloning the gist therefore
      # does not reproduce the committed engine, and a check that cannot pass is worse than
      # no check — so `npm run gen:engine:check` stays a local step, where the lab that
      # actually produced the engine lives. It runs as part of `npm run check`.
      - run: npm ci

      - name: Engine is current
        run: npm run gen:engine:check

      - run: npm run lint

      - run: npm test

      - run: npm run build
